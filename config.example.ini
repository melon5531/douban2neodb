[douban]
; 你的豆瓣个人主页地址 https://www.douban.com/people/xxxxxx/ 里的 xxxxxx
user_id =

; 登录 douban.com 后，按 F12 -> Network -> 任意请求 -> Request Headers 里的整串 Cookie 复制到这里
;（只要包含 dbcl2 / bid 等字段的完整 cookie 串即可，单行）
cookie =

; 每次抓取豆瓣页面之间的间隔秒数（豆瓣有反爬，不建议低于 2）
delay = 3.0

[neodb]
; 你使用的 NeoDB 实例，官方站就是默认值
base_url = https://neodb.social

; 在 NeoDB 网页：设置 -> 开发者（Developer）-> 创建访问令牌，勾选 read 和 write
token =

; 标记的可见性：0=公开 1=仅关注者 2=仅自己
visibility = 0

; 调用 NeoDB API 的间隔秒数（NeoDB 会去豆瓣抓条目，太快容易 504）
api_delay = 1.0
